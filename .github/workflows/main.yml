name: Frontend testing
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  frontend-tests:
    name: Frontend Go tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.16'
          cache: false
      - name: Build
        run: go build ./...
      - name: Test
        run: go test frontend
